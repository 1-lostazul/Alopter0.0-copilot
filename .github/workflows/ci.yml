name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-conditional-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Super-Linter for repo docs
        uses: github/super-linter@v4
        env:
          VALIDATE_MARKDOWN: true
          DEFAULT_BRANCH: main

      - name: Conditional Android build (if Android app exists and gradle wrapper present)
        run: |
          if [ -f "./gradlew" ]; then
            echo "Gradle wrapper found — running assembleDebug"
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon
          elif [ -d "app" ] && ls app | grep -E "build.gradle|build.gradle.kts" >/dev/null 2>&1; then
            echo "Android app module detected but gradlew is missing — skipping build. To enable CI build, add the Gradle wrapper to the repository."
          else
            echo "No Android project found — skipping build"
          fi
